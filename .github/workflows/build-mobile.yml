name: Build Z-TORUS RİFE Mobile Apps (iOS & Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          cd wifi
          npm install

      - name: Build Web Assets & Sync Android
        run: |
          cd wifi
          npm run build
          npx cap sync android

      - name: Build Android APK
        run: |
          cd wifi/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-TORUS-RIFE-Android-APK
          path: wifi/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS Xcode App (Mac Cloud Runner)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd wifi
          npm install

      - name: Build Web Assets & Sync iOS
        run: |
          cd wifi
          npm run build
          npx cap sync ios

      - name: Build iOS Xcode Project
        run: |
          cd wifi/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -derivedDataPath build

      - name: Compress iOS App Package
        run: |
          cd wifi/ios/App/build/Build/Products/Debug-iphoneos
          mkdir Payload
          cp -r App.app Payload/
          zip -r Z-TORUS-RIFE-iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-TORUS-RIFE-iOS-Package
          path: wifi/ios/App/build/Build/Products/Debug-iphoneos/Z-TORUS-RIFE-iOS.ipa
