<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z-Torus — Manevi Frekanslar</title>
    <link rel="stylesheet" href="home.css?v=2.3.1">
    <script src="z_vault_core.js?v=2.5.1"></script>
    <script src="manevi_data.js?v=2.4.5"></script>
    <script src="translations.js?v=2.5"></script>
    <style>
        body {
            background-image: linear-gradient(rgba(13, 15, 33, 0.9), rgba(13, 15, 33, 0.95)), url('images/menu_spiritual.webp');
            background-size: cover;
            background-position: center;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .manevi-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .list-screen {
            width: 100%;
            overflow-y: auto;
            flex-grow: 1;
            padding-bottom: 40px;
        }

        .manevi-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .manevi-item:hover {
            background: rgba(255, 215, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.3);
            transform: translateY(-2px);
        }

        .item-info { flex: 1; margin-left: 15px; }
        .item-info h3 { font-size: 16px; color: #FFD700; margin-bottom: 2px; }
        .item-info p { font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.4; }

        .item-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,215,0,0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .item-icon img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .item-meta { text-align: right; margin-left: 10px; }
        .item-meta span { display: block; font-size: 11px; color: #a855f7; font-weight: 700; }

        .fav-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            padding: 5px;
            margin-left: 10px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fav-btn:hover { color: rgba(255, 215, 0, 0.8); transform: scale(1.1); }
        .fav-btn.active { color: #ff4757; }
        .fav-btn svg { width: 22px; height: 22px; }

        /* PLAYER SCREEN */
        .player-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            height: 100%;
            width: 100%;
            text-align: center;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        .nur-ring {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 4px solid #FFD700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
            position: relative;
            animation: ringPulse 2s infinite alternate ease-in-out;
        }

        @keyframes ringPulse {
            from { box-shadow: 0 0 30px rgba(255, 215, 0, 0.2); transform: scale(0.98); }
            to { box-shadow: 0 0 70px rgba(255, 215, 0, 0.5); transform: scale(1.02); }
        }

        .freq-display {
            font-size: 32px;
            font-weight: 800;
            color: #FFD700;
        }

        .timer-display {
            font-size: 24px;
            color: #fff;
            margin-top: 20px;
            font-family: monospace;
        }

        .description-box {
            background: rgba(0,0,0,0.4);
            border-top: 2px solid #FFD700;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            margin-top: 40px;
            backdrop-filter: blur(10px);
        }

        .description-box h2 { color: #FFD700; margin-bottom: 10px; }
        .description-box p { line-height: 1.6; font-style: italic; color: rgba(255,255,255,0.9); }

        .playing .nur-ring {
            border-style: double;
            animation: ringSpin 3s linear infinite;
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="manevi-container">
        <!-- LİSTE EKRANI -->
        <div id="listScreen" class="list-screen">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 30px;">
                <a id="mainBackBtn" href="index.html" style="color: #FFD700; text-decoration: none; display: flex; align-items: center;">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                </a>
                <a id="subBackBtn" href="#" onclick="showMainList(); return false;" style="color: #FFD700; text-decoration: none; display: none; align-items: center;">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </a>
                <h1 id="listTitle" style="color:#FFD700; margin: 0; font-size: 24px; letter-spacing: 1px;">MANEVİ FREKANSLAR</h1>
            </div>
            <div id="itemsContainer"></div>
        </div>

        <!-- OYNATICI EKRANI -->
        <div id="playerScreen" class="player-screen">
            <button class="back-btn" onclick="showList()">← Geri</button>
            
            <div id="activeName" style="font-size: 28px; font-weight: 800; color: #FFD700;"></div>
            
            <div class="nur-ring" id="visualizer">
                <div class="freq-display"><span id="activeFreq">0</span> Hz</div>
            </div>

            <div class="timer-display" id="timer">00:00</div>

            <!-- MOD VE KONTROL SEÇİMİ -->
            <div class="mode-selector" style="display: flex; gap: 20px; align-items: center; margin-top: 20px;">
                <!-- KULAKLIK -->
                <div id="modeSine" class="mode-btn" onclick="handleModeClick('sine')">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M12 3C7.03 3 3 7.03 3 12v7c0 1.1.9 2 2 2h4v-8H5v-1c0-3.87 3.13-7 7-7s7 3.13 7 7v1h-4v8h4c1.1 0 2-.9 2-2v-7c0-4.97-4.03-9-9-9z"/></svg>
                    <span style="display:block; font-size:10px; margin-top:5px;">KULAKLIK</span>
                </div>

                <!-- DURAKLAT (PAUSE) -->
                <div id="btnPause" class="mode-btn" onclick="togglePlayPause()" style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 50%;">
                    <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </div>

                <!-- BOBİN -->
                <div id="modeSquare" class="mode-btn" onclick="handleModeClick('square')">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-4-8c0-2.21 1.79-4 4-4s4 1.79 4 4-1.79 4-4 4-4-1.79-4-4z"/></svg>
                    <span style="display:block; font-size:10px; margin-top:5px;">BOBİN</span>
                </div>
            </div>

            <div class="description-box">
                <p id="activeDesc"></p>
            </div>
        </div>
    </div>

    <style>
        .mode-btn {
            opacity: 0.3;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            padding: 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }
        .mode-btn svg {
            width: 40px;
            height: 40px;
            margin-bottom: 8px;
        }
        .mode-btn.active {
            opacity: 1;
            color: #FFD700;
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            transform: scale(1.1);
        }
        #btnPause {
            background: rgba(255,255,255,0.05);
            padding: 18px;
            border-radius: 50%;
            opacity: 0.8;
        }
        #btnPause:hover { opacity: 1; background: rgba(255,255,255,0.1); }
    </style>

    <script>
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;
        let timeLeft = 0;
        let timerInterval = null;
        let waveType = 'triangle'; 
        let currentItem = null;
        let currentSeqIndex = 0;
        let seqTimeLeft = 0;
        let wakeLock = null;

        async function requestWakeLock() {
            if (!('wakeLock' in navigator)) return;
            if (wakeLock) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (err) {}
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback', sampleRate: 48000 });
                } catch(e) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
                }
            }
        }

        function handleModeClick(type) {
            initAudio();
            waveType = (type === 'sine') ? 'triangle' : 'square';
            
            if (currentItem) {
                let initialFreq = (currentItem.sequence && currentItem.sequence.length > 0) ? currentItem.sequence[currentSeqIndex].freq : currentItem.freq;
                playFrequency(initialFreq, true);
                if (!timerInterval) {
                    startTimer();
                }
            }
            
            document.getElementById('modeSine').classList.toggle('active', type === 'sine');
            document.getElementById('modeSquare').classList.toggle('active', type === 'square');
            
            const btnPauseSvg = document.querySelector('#btnPause svg');
            if (btnPauseSvg) btnPauseSvg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }

        function togglePlayPause() {
            if (timerInterval || oscillator) {
                stopFrequency(true);
            } else {
                let typeToPlay = (waveType === 'triangle') ? 'sine' : 'square';
                handleModeClick(typeToPlay);
            }
        }

        function getLocalized(item, field) {
            let lang = localStorage.getItem('zlang') || 'tr-TR';
            if (lang === 'tr-TR') return item[field];
            if (item[field + '_i18n'] && item[field + '_i18n'][lang]) {
                return item[field + '_i18n'][lang];
            }
            if (item[field + '_i18n'] && item[field + '_i18n']['en-US']) {
                return item[field + '_i18n']['en-US'];
            }
            return item[field];
        }

        let currentDataArray = maneviData;

        function renderList(dataArray = maneviData, title = 'MANEVİ FREKANSLAR', isSubList = false) {
            currentDataArray = dataArray;
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';
            
            // i18n title translation
            let displayTitle = title;
            const lang = localStorage.getItem('zlang') || 'tr-TR';
            if (title === 'MANEVİ FREKANSLAR' && window.i18n && window.i18n[lang] && window.i18n[lang].hub_card_manevi_title) {
                displayTitle = window.i18n[lang].hub_card_manevi_title.toUpperCase();
            } else if (title === 'ESMAÜL HÜSNA') {
                displayTitle = 'ESMA-UL HUSNA'; // Simple fallback
            }
            
            document.getElementById('listTitle').innerText = displayTitle;
            if (isSubList) {
                document.getElementById('mainBackBtn').style.display = 'none';
                document.getElementById('subBackBtn').style.display = 'flex';
            } else {
                document.getElementById('mainBackBtn').style.display = 'flex';
                document.getElementById('subBackBtn').style.display = 'none';
            }

            dataArray.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'manevi-item';
                div.onclick = () => {
                    if (item.isCategory) {
                        renderList(esmaulHusnaData, item.name, true);
                    } else {
                        selectManevi(index);
                    }
                };

                // İkon belirleme
                let iconHtml = '✨';
                if (item.isCategory) {
                    iconHtml = '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>';
                } else {
                    const n = item.name.toLowerCase();
                    if (n.includes('kök') || n.includes('root')) iconHtml = '<img src="icons/chakra1.png">';
                    else if (n.includes('sakral') || n.includes('sacral')) iconHtml = '<img src="icons/chakra2.png">';
                    else if (n.includes('pleksus') || n.includes('plexus')) iconHtml = '<img src="icons/chakra3.png">';
                    else if (n.includes('kalp') || n.includes('heart')) iconHtml = '<img src="icons/chakra4.png">';
                    else if (n.includes('boğaz') || n.includes('throat')) iconHtml = '<img src="icons/chakra5.png">';
                    else if (n.includes('üçüncü göz') || n.includes('third eye')) iconHtml = '<img src="icons/chakra6.png">';
                    else if (n.includes('taç') || n.includes('crown')) iconHtml = '<img src="icons/chakra7.png">';
                }

                let itemSource = (typeof esmaulHusnaData !== 'undefined' && dataArray === esmaulHusnaData) ? 'Esmaül Hüsna' : 'Manevi';
                let isFav = false;
                if (window.myData && window.myData.profiles) {
                    for (let p of window.myData.profiles) {
                        if (p && p.favorites && p.favorites.includes(item.name + '|' + itemSource)) {
                            isFav = true;
                            break;
                        }
                    }
                }
                const favClass = isFav ? 'fav-btn active' : 'fav-btn';
                const favFill = isFav ? 'currentColor' : 'none';
                
                const favHtml = `<button class="${favClass}" onclick="toggleFav(event, '${item.name.replace(/'/g, "\\'")}', '${itemSource}')">
                    <svg viewBox="0 0 24 24" fill="${favFill}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                </button>`;

                if (item.isCategory) {
                    let safeDesc1 = window.sanitizeMedicalWords ? window.sanitizeMedicalWords(getLocalized(item, 'desc')) : getLocalized(item, 'desc');
                    let safeName1 = window.sanitizeMedicalWords ? window.sanitizeMedicalWords(getLocalized(item, 'name')) : getLocalized(item, 'name');
                    div.innerHTML = `
                        <div class="icon">✨</div>
                        <div class="details">
                            <h4>${safeName1}</h4>
                            <p>${safeDesc1.substring(0, 45)}...</p>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <div class="item-meta">
                                <span style="font-size: 16px;">➔</span>
                            </div>
                        </div>
                    `;
                } else {
                    let safeDesc2 = window.sanitizeMedicalWords ? window.sanitizeMedicalWords(getLocalized(item, 'desc')) : getLocalized(item, 'desc');
                    let safeName2 = window.sanitizeMedicalWords ? window.sanitizeMedicalWords(getLocalized(item, 'name')) : getLocalized(item, 'name');
                    div.innerHTML = `
                        <div class="item-icon">${iconHtml}</div>
                        <div class="item-info">
                            <h3>${safeName2}</h3>
                            <p>${safeDesc2.substring(0, 45)}...</p>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <div class="item-meta">
                                <span>${item.freq} Hz</span>
                                <span>${formatTime(item.duration)}</span>
                            </div>
                            ${favHtml}
                        </div>
                    `;
                }
                container.appendChild(div);
            });
        }

        window.myData = (() => {
            try {
                const d = JSON.parse(localStorage.getItem('zapp_my_data'));
                if (d && typeof d === 'object' && d.profiles) return d;
            } catch(e) {}
            return {
                profiles: [{ id: 'p' + Date.now(), name: 'Genel', lists: [], favorites: [], color: '#303E6C' }],
                activeProfileId: null
            };
        })();

        if (window.myData.profiles && Array.isArray(window.myData.profiles)) {
            window.myData.profiles.forEach(p => { 
                if (p && !p.favorites) p.favorites = []; 
            });
        }
        if (!window.myData.activeProfileId && window.myData.profiles && window.myData.profiles.length > 0) {
            window.myData.activeProfileId = window.myData.profiles[0].id;
        }

        function saveData() {
            localStorage.setItem('zapp_my_data', JSON.stringify(window.myData));
        }

        let pendingFavName = null;
        let pendingFavSource = null;

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function toggleFav(e, name, source) {
            e.stopPropagation();
            pendingFavName = name;
            pendingFavSource = source;
            
            const profileList = document.getElementById('favProfileList');
            profileList.innerHTML = window.myData.profiles.map(p => `
                <button class="m-btn" style="background: white; color: var(--primary, #303E6C); border: 1px solid rgba(0,0,0,0.1); width: 100%; display: flex; align-items: center; justify-content: flex-start; text-align: left; margin-bottom: 8px;" onclick="addFavToProfile('${p.id}')">
                    <div style="width:24px; height:24px; border-radius:50%; font-size:10px; font-weight:bold; color:white; display:flex; align-items:center; justify-content:center; margin-right:10px; background:${p.color}">${p.name[0].toUpperCase()}</div>
                    ${p.name}
                </button>
            `).join('');
            
            document.getElementById('favPickerModal').classList.add('active');
        }

        function addFavToProfile(profileId) {
            const prof = window.myData.profiles.find(p => p.id === profileId);
            if (!prof) return;

            const favId = pendingFavName + '|' + pendingFavSource;
            const idx = prof.favorites.indexOf(favId);
            if (idx > -1) {
                showToast("Zaten ekli!");
            } else {
                prof.favorites.push(favId);
                showToast("Listeye eklendi!");
                saveData();
            }
            
            closeModal('favPickerModal');
            pendingFavName = null;
            pendingFavSource = null;
            
            renderList(currentDataArray, document.getElementById('listTitle').innerText, document.getElementById('subBackBtn').style.display === 'flex');
        }

        function showMainList() {
            renderList(maneviData, 'MANEVİ FREKANSLAR', false);
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.bottom = '40px';
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.style.bottom = '-60px';
            }, 2500);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function selectManevi(index) {
            currentItem = currentDataArray[index];
            timeLeft = currentItem.duration;
            
            if (currentItem.sequence && currentItem.sequence.length > 0) {
                currentSeqIndex = 0;
                seqTimeLeft = currentItem.sequence[0].duration;
                document.getElementById('activeFreq').innerText = currentItem.sequence[0].freq;
            } else {
                document.getElementById('activeFreq').innerText = currentItem.freq;
            }
            
            document.getElementById('listScreen').style.display = 'none';
            document.getElementById('playerScreen').style.display = 'flex';
            
            let rawActiveName = getLocalized(currentItem, 'name');
            document.getElementById('activeName').innerText = window.sanitizeMedicalWords ? window.sanitizeMedicalWords(rawActiveName) : rawActiveName;

            let safeManeviDesc = window.sanitizeMedicalWords ? window.sanitizeMedicalWords(getLocalized(currentItem, 'desc')) : getLocalized(currentItem, 'desc');
            let formattedDesc = safeManeviDesc.replace(/\[(.*?)\]/g, '<span style="color: #4ade80; font-weight: bold;">[$1]</span>');
            document.getElementById('activeDesc').innerHTML = formattedDesc;
            
            updateTimerDisplay();
            stopFrequency(); 
            document.getElementById('modeSine').classList.remove('active');
            document.getElementById('modeSquare').classList.remove('active');
        }

        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();

                    if (currentItem.sequence && currentItem.sequence.length > 0) {
                        seqTimeLeft--;
                        if (seqTimeLeft <= 0) {
                            currentSeqIndex++;
                            if (currentSeqIndex < currentItem.sequence.length) {
                                seqTimeLeft = currentItem.sequence[currentSeqIndex].duration;
                                let nextFreq = currentItem.sequence[currentSeqIndex].freq;
                                playFrequency(nextFreq, true);
                                document.getElementById('activeFreq').innerText = nextFreq;
                            }
                        }
                    }
                } else {
                    stopFrequency();
                    alert("Süre tamamlandı. Şifa olsun.");
                    showList();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('timer').innerText = formatTime(timeLeft);
        }

        function playFrequency(freq, isTransition = false) {
            stopFrequency(!isTransition);
            if (!audioCtx) initAudio();
            
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            
            oscillator.type = waveType;
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            const targetGain = (waveType === 'triangle') ? 0.9 : 0.5;
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(targetGain, audioCtx.currentTime + 0.1);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            document.getElementById('playerScreen').classList.add('playing');
            requestWakeLock();
        }

        function stopFrequency(shouldStopTimer = true) {
            if (oscillator) {
                oscillator.stop();
                oscillator = null;
            }
            if (shouldStopTimer && timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                document.getElementById('modeSine').classList.remove('active');
                document.getElementById('modeSquare').classList.remove('active');
            }
            document.getElementById('playerScreen').classList.remove('playing');
            
            if (shouldStopTimer) {
                const btnPauseSvg = document.querySelector('#btnPause svg');
                if (btnPauseSvg) btnPauseSvg.innerHTML = '<path d="M8 5v14l11-7z"/>';
                releaseWakeLock();
            }
        }

        function showList() {
            stopFrequency();
            document.getElementById('listScreen').style.display = 'block';
            document.getElementById('playerScreen').style.display = 'none';
        }

        // Z-Vault Security Check
        if (window.ZVault && !window.ZVault.isActivated()) {
            console.log("Security: Activation required.");
            document.getElementById('listScreen').innerHTML = '<div style="padding:40px; text-align:center; color:#FFD700;">Aktivasyon Gerekli...</div>';
            window.ZVault.init();
        } else {
            renderList();
            
            const urlParams = new URLSearchParams(window.location.search);
            const playName = urlParams.get('play');
            const playSrc = urlParams.get('src');
            
            if (playName) {
                let targetArray = maneviData;
                if (playSrc === 'Esmaül Hüsna') targetArray = esmaulHusnaData;
                
                const index = targetArray.findIndex(x => x.name === playName);
                if (index !== -1) {
                    currentDataArray = targetArray;
                    if (playSrc === 'Esmaül Hüsna') {
                        document.getElementById('listTitle').innerText = 'ESMAÜL HÜSNA';
                        document.getElementById('subBackBtn').style.display = 'flex';
                    }
                    selectManevi(index);
                }
            }
        }
    </script>
